<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#234bd8"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172647}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#546482}.box-title{font-size:25px;font-weight:700}.body{font-size:21px}.label{font-size:18px;fill:#234bd8}.small{font-size:19px;fill:#546482}</style><rect width="1800" height="1260" fill="#f4f6fa"/><text x="65" y="82" class="title">kind</text><text x="65" y="128" class="sub">Volunteer coverage with human approval</text><text x="65" y="161" class="small">Deployed architecture · Strands Agents + Amazon Bedrock · Good Neighbor Agents</text>
<rect x="65" y="215" width="330" height="170" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="89" y="254" class="box-title">Coordinator browser</text><text x="89" y="287" class="body">React + TypeScript</text><text x="89" y="314" class="body">Access code → signed cookie</text><text x="89" y="341" class="body">Review exact invitation text</text>
<rect x="65" y="455" width="330" height="170" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="89" y="494" class="box-title">Volunteer browser</text><text x="89" y="527" class="body">Scoped bearer response link</text><text x="89" y="554" class="body">Accept or decline</text><text x="89" y="581" class="body">No roster or directory access</text>
<rect x="495" y="315" width="320" height="145" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="519" y="354" class="box-title">API Gateway</text><text x="519" y="387" class="body">Public HTTPS endpoint</text><text x="519" y="414" class="body">Routes to the API function</text>
<rect x="915" y="265" width="350" height="205" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="939" y="304" class="box-title">API Lambda</text><text x="939" y="337" class="body">FastAPI + Mangum</text><text x="939" y="364" class="body">Authenticate and validate</text><text x="939" y="391" class="body">Approve link; recheck capacity</text><text x="939" y="418" class="body">Admit one bounded AI job</text>
<rect x="1365" y="265" width="365" height="205" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="1389" y="304" class="box-title">DynamoDB</text><text x="1389" y="337" class="body">Fictional shared workspace</text><text x="1389" y="364" class="body">Conditional versioned writes</text><text x="1389" y="391" class="body">Roster, invitations, activity</text><text x="1389" y="418" class="body">Persisted daily AI allowance</text>
<rect x="915" y="600" width="350" height="170" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="939" y="639" class="box-title">Private worker Lambda</text><text x="939" y="672" class="body">Asynchronous job execution</text><text x="939" y="699" class="body">Strands Agents SDK</text><text x="939" y="726" class="body">One reserved execution</text>
<rect x="1365" y="600" width="365" height="170" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="1389" y="639" class="box-title">Amazon Bedrock</text><text x="1389" y="672" class="body">Amazon Nova Lite</text><text x="1389" y="699" class="body">Model selects bounded tools</text><text x="1389" y="726" class="body">5 model calls maximum / run</text>
<rect x="495" y="600" width="320" height="170" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="519" y="639" class="box-title">Agent tools</text><text x="519" y="672" class="body">get_shift_context</text><text x="519" y="699" class="body">check_eligibility</text><text x="519" y="726" class="body">prepare_invitation</text>
