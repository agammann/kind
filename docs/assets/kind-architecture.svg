<rect x="65" y="835" width="750" height="205" rx="20" fill="#eaf0ff" stroke="#ccd5e5"/><text x="89" y="874" class="box-title">Authority stays outside the model</text><text x="89" y="907" class="body">The agent may inspect context and prepare one draft.</text><text x="89" y="934" class="body">Only the coordinator can activate a response link.</text><text x="89" y="961" class="body">Only acceptance can fill an eligible, available roster slot.</text><text x="89" y="988" class="body">No email or SMS is sent by this demo.</text>
<rect x="915" y="835" width="815" height="205" rx="20" fill="#ffffff" stroke="#ccd5e5"/><text x="939" y="874" class="box-title">Hosting and operational boundaries</text><text x="939" y="907" class="body">Private encrypted S3 package; scoped runtime IAM roles.</text><text x="939" y="934" class="body">CloudWatch logs retained 7 days; encrypted failure queue.</text><text x="939" y="961" class="body">20 admitted live AI runs per UTC day; this is not a dollar cap.</text><text x="939" y="988" class="body">Coordinator confirms sample restart; paid allowance survives.</text>
<text x="65" y="1100" class="box-title">Local development</text><text x="65" y="1136" class="body">The same FastAPI workflow runs with SQLite. Rules mode makes no model calls.</text><text x="65" y="1190" class="small">Verified: live model preparation → coordinator approval → volunteer acceptance → persisted roster.</text><text x="65" y="1225" class="small">Fictional demo only. No AgentCore deployment, real nonprofit adoption, or measured impact is claimed.</text></svg>